# End-to-end functional tests.
#
# `elis-gate` requires a successful check named `e2e` on the current commit of every
# high-risk pull request, so this workflow reports that check on every pull request that
# is out of draft. It also runs every night on `main`.
#
# Set-up in each repository:
#   - Variable E2E_COMMAND: the command that runs the end-to-end tests.
#     While it is unset, the job passes with a notice.
#
# The job runs code from the pull request, so it has read-only access and no secrets.

name: e2e

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the end-to-end tests
        env:
          E2E_COMMAND: ${{ vars.E2E_COMMAND }}
        run: |
          if [[ -n "$E2E_COMMAND" ]]; then
            bash -e -o pipefail -c "$E2E_COMMAND"
          else
            echo "::notice::E2E_COMMAND is unset. No end-to-end tests are configured."
          fi
