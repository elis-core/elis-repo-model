name: pr-compliance
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      head-sha: ${{ steps.validate.outputs.head-sha }}
    steps:
      - name: Validate the pull request
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const branch = /^(?:[a-z][a-z0-9-]*)\/([1-9]\d*)-[a-z0-9]+(?:-[a-z0-9]+)*$/.exec(pr.head.ref);
            if (!branch) throw new Error('Use an Issue branch such as feat/123-short-summary.');

            if (!/^[a-z]+(?:\([\w./-]+\))?!?: \S/.test(pr.title)) {
              throw new Error('Use a Conventional Commits title.');
            }

            const body = (pr.body || '').replace(/<!--[\s\S]*?(?:-->|$)/g, '');
            const sections = new Map([...body.matchAll(/^## ([^\r\n]+)\r?\n([\s\S]*?)(?=^## |(?![\s\S]))/gm)]
              .map(([, heading, content]) => [heading.trim(), content.trim()]));
            for (const heading of ['Objective', 'Related Issue', 'Changes', 'Evidence', 'Risk and rollback']) {
              if (!sections.get(heading)) throw new Error(`Complete the "${heading}" section.`);
            }
            const issue = /^(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#([1-9]\d*)\b/im.exec(sections.get('Related Issue'));
            if (!issue || issue[1] !== branch[1]) throw new Error('Link the branch Issue with a closing reference.');
            const { data: linkedIssue } = await github.rest.issues.get({ owner, repo, issue_number: Number(issue[1]) });
            if (linkedIssue.pull_request) throw new Error('The linked number must refer to an Issue.');

            const { data: registry } = await github.rest.repos.getContent({
              owner, repo, path: '.github/agents.yml', ref: 'main',
            });
            const source = Buffer.from(registry.content, 'base64').toString('utf8');
            const registered = source.split(/^\s*- id:\s*/m).slice(1).some(entry =>
              /^\s*role:\s*implementer\s*(?:#.*)?$/m.test(entry) &&
              /^\s*app:\s*([a-z0-9-]+)\s*(?:#.*)?$/m.exec(entry)?.[1]?.concat('[bot]').toLowerCase() === pr.user.login.toLowerCase());
            if (pr.user.type !== 'Bot' || !registered) throw new Error('The author must be a registered Implementer.');

            if (!pr.draft && pr.state === 'open') core.setOutput('head-sha', pr.head.sha);

  merge:
    needs: validate
    if: needs.validate.outputs.head-sha != ''
    runs-on: ubuntu-latest
    permissions: {}
    environment: agent-orc
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.ORC_APP_ID }}
          private-key: ${{ secrets.ORC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Enable squash auto-merge or merge a clean pull request
        uses: actions/github-script@v7
        env:
          VALIDATED_HEAD_SHA: ${{ needs.validate.outputs.head-sha }}
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.draft || pr.state !== 'open' || pr.head.sha !== process.env.VALIDATED_HEAD_SHA) return;
            const { node } = await github.graphql(`query ($id: ID!) {
              node(id: $id) { ... on PullRequest { autoMergeRequest { enabledAt } } }
            }`, { id: pr.node_id });
            if (node.autoMergeRequest) return;

            try {
              await github.graphql(`mutation ($id: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                  pullRequest { id }
                }
              }`, { id: pr.node_id });
            } catch (error) {
              if (error.errors?.length !== 1 ||
                  !/\bis in clean status\b/i.test(error.errors[0].message)) throw error;

              const { data: result } = await github.rest.pulls.merge({
                owner, repo, pull_number, merge_method: 'squash', sha: pr.head.sha,
              });
              if (!result.merged) throw new Error(result.message || 'Squash merge failed.');
            }
